version: '3.8'

services:
  technest_backend:
    image: ${DOCKER_REGISTRY-}technest_backend:0.1
    container_name: TechNest-backend
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80;http://+:443
    ports:
      - "8013:80"
    restart: unless-stopped
    # volumes:
    #   - uploads:/app/Img

  technest_frontend:
    image: ${DOCKER_REGISTRY-}technest_frontend:0.1
    container_name: TechNest-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"

  postgres_db:
    image: postgres:17.0-bookworm
    container_name: TechNest-PostgreSQL
    environment:
      POSTGRES_DB: "TechNestDB"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "root"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # PgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: TechNest-PgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: rozanovivan13@gmail.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres_db

  # Redis
  redis_cache:
    image: redis:7.4-bookworm
    container_name: TechNest-Redis
    environment:
      - REDIS_PASSWORD=root
      - REDIS_USER=admin
      - REDIS_USER_PASSWORD=admin
    ports:
      - "6380:6379"
    volumes:
      - redis_cache:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "root", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

volumes:
  postgres_data:
  pgadmin_data:
  redis_cache: # uploads:
